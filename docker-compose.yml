# Despliegue de Cartera Temporal detras de Nginx Proxy Manager.
# No se publica ningun puerto al host: el acceso entra por NPM,
# que vive en la misma red 'npm-network' y resuelve por nombre de servicio.
#
#   NPM -> Forward Hostname: cartera-temporal-back   Port: 8021

services:
  cartera-temporal-back:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        XMX: ${XMX:-1024m}
        PROFILE: ${PROFILE:-develop}
    image: cartera-temporal-back:local
    container_name: cartera-temporal-back
    restart: unless-stopped

    environment:
      TZ: ${TZ:-America/Bogota}
      # Recibos y firmas se leen y escriben con la API de Google Drive (valores en .env).
      # DRIVE_ROOT_FOLDER_ID = carpeta que antes se montaba con rclone (contiene Firmas/ y Recibos/)
      DRIVE_CLIENT_ID: ${DRIVE_CLIENT_ID:-}
      DRIVE_CLIENT_SECRET: ${DRIVE_CLIENT_SECRET:-}
      DRIVE_REFRESH_TOKEN: ${DRIVE_REFRESH_TOKEN:-}
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:-}

    user: "${PUID:-1001}:${PGID:-1001}"

    # Solo visible dentro de npm-network, nunca en el host
    expose:
      - "8021"

    volumes:
      # Logs y temporales en disco local
      - cartera_logs:/var/log/cartera
      - cartera_tmp:/tmp

    networks:
      - npm-network

    healthcheck:
      # Comprueba que el puerto responde, sin depender de auth del actuator
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8021' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Instancia de pruebas (rutas /api/v2, nombre cartera-temporal-microservice-test).
  # Imagen y contenedor propios para no pisar produccion. Levantar solo este servicio:
  #   docker compose up -d --build cartera-temporal-back-test
  #   NPM -> Forward Hostname: cartera-temporal-back-test   Port: 8021
  cartera-temporal-back-test:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        XMX: ${XMX_TEST:-512m}
        PROFILE: ${PROFILE_TEST:-develop}
    image: cartera-temporal-back:test
    container_name: cartera-temporal-back-test
    restart: unless-stopped

    environment:
      TZ: ${TZ:-America/Bogota}
      DRIVE_CLIENT_ID: ${DRIVE_CLIENT_ID:-}
      DRIVE_CLIENT_SECRET: ${DRIVE_CLIENT_SECRET:-}
      DRIVE_REFRESH_TOKEN: ${DRIVE_REFRESH_TOKEN:-}
      # Usa la misma carpeta de produccion: lee los recibos existentes y guarda ahi los nuevos
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:-}

    user: "${PUID:-1001}:${PGID:-1001}"

    expose:
      - "8021"

    volumes:
      - cartera_logs_test:/var/log/cartera
      - cartera_tmp_test:/tmp

    networks:
      - npm-network

    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8021' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  npm-network:
    external: true

volumes:
  cartera_logs:
  cartera_tmp:
  cartera_logs_test:
  cartera_tmp_test:
